# Secret do Mongo. ATENÇÃO: valores PLACEHOLDER, nunca coloque valores reais aqui.
# Na pipeline o Secret real é criado a partir do GitHub Secrets
# (kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -).
# stringData aceita texto puro; o Kubernetes converte para base64 sozinho.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: garageflow
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: admin
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME
