# StatefulSet do Mongo: usado para bancos porque o pod tem identidade estável
# (mongo-0) e o próprio disco. Aqui é 1 réplica, sem alta disponibilidade.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: garageflow
  labels:
    app.kubernetes.io/name: mongo
spec:
  serviceName: mongo # Service headless que governa este StatefulSet
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
              name: mongo
          # Usuário e senha do root vêm do Secret (só valem no primeiro boot do disco).
          envFrom:
            - secretRef:
                name: mongo-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probes TCP: só confirmam que a porta responde.
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
  # Cria um PersistentVolumeClaim por pod. No k3s e no kind usa o storage local padrão.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
