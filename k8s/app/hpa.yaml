# HorizontalPodAutoscaler: aumenta/diminui o número de pods pela CPU média.
# Precisa do metrics-server (o k3s já traz) e de `requests` no Deployment.
# 50% de 200m = 100m de CPU média por pod; acima disso ele cria pods (até 3).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: garageflow-app
  namespace: garageflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: garageflow-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    # Reduz mais rápido que o padrão (5 min), para a demo do vídeo.
    scaleDown:
      stabilizationWindowSeconds: 60
