# Secret da app. ATENÇÃO: valores PLACEHOLDER, nunca coloque valores reais aqui.
# Na pipeline o Secret real é criado a partir do GitHub Secrets.
# - SPRING_MONGODB_URI: a senha deve ser a mesma do mongo-secret.
# - JWT_SECRET: a app usa o texto como chave HMAC e exige pelo menos 32 caracteres
#   (menos que isso a app nem sobe), por isso o placeholder é comprido.
apiVersion: v1
kind: Secret
metadata:
  name: garageflow-app-secret
  namespace: garageflow
type: Opaque
stringData:
  SPRING_MONGODB_URI: mongodb://admin:CHANGE_ME@mongo:27017/garageflow-soat-17-2026-db?authSource=admin
  JWT_SECRET: CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_0123456789
  ADMIN_SEED_PASSWORD: CHANGE_ME
