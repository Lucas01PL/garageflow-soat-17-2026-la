# Secret da app. ATENÇÃO: valores PLACEHOLDER, nunca coloque valores reais aqui.
# Na pipeline o Secret real é criado a partir do GitHub Secrets e do SSM.
# - SPRING_MONGODB_URI: o host é o IP privado da EC2 do MongoDB (criada pelo
#   Terraform) e a senha vem do parâmetro do SSM. A pipeline descobre os dois.
# - JWT_SECRET: a app usa o texto como chave HMAC e exige pelo menos 32 caracteres
#   (menos que isso a app nem sobe), por isso o placeholder é comprido.
apiVersion: v1
kind: Secret
metadata:
  name: garageflow-app-secret
  namespace: garageflow
type: Opaque
stringData:
  SPRING_MONGODB_URI: mongodb://admin:CHANGE_ME@MONGO_HOST:27017/garageflow-soat-17-2026-db?authSource=admin
  JWT_SECRET: c2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtb25seS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1lbnZzLTI1Ng==
  ADMIN_SEED_PASSWORD: admin123
