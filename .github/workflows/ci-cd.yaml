name: CI/CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/garageflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: garageflow-jar
          path: target/*.jar
          retention-days: 1
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read

    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: garageflow-dev
      ALB_NAME: garageflow-dev-alb
      MONGO_NAME: garageflow-dev-mongo
      MONGO_SSM_PARAMETER: /garageflow/dev/mongo-password

    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Conectar no cluster EKS
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl cluster-info

      - name: Esperar o nó ficar pronto
        run: kubectl wait --for=condition=Ready node --all --timeout=600s

      - name: Instalar metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s

      - name: Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Localizar o MongoDB e criar Secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          MONGO_PASSWORD=$(aws ssm get-parameter --name "$MONGO_SSM_PARAMETER" \
            --with-decryption --query 'Parameter.Value' --output text)
          echo "::add-mask::$MONGO_PASSWORD"

          MONGO_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$MONGO_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          echo "MongoDB em $MONGO_IP"
          if [ -z "$MONGO_IP" ] || [ "$MONGO_IP" = "None" ]; then
            echo "Instância do MongoDB não encontrada. O terraform apply foi feito?"
            exit 1
          fi
          echo "MONGO_IP=$MONGO_IP" >> "$GITHUB_ENV"

          kubectl create secret generic garageflow-app-secret -n garageflow \
            --from-literal=SPRING_MONGODB_URI="mongodb://admin:${MONGO_PASSWORD}@${MONGO_IP}:27017/garageflow-soat-17-2026-db?authSource=admin" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_SEED_PASSWORD="$ADMIN_SEED_PASSWORD" \
            --from-literal=MAIL_PASSWORD="${MAIL_PASSWORD// /}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Esperar o MongoDB responder
        run: |
          kubectl run mongo-check -n garageflow --rm -i --restart=Never \
            --image=busybox:1.36 --command -- sh -c \
            'for i in $(seq 1 60); do nc -z -w 3 "$0" 27017 && exit 0; sleep 5; done; exit 1' "$MONGO_IP"

      - name: Deploy da aplicação
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "Load Balancer não encontrado: $ALB_NAME"
            exit 1
          fi

          kubectl apply -f k8s/app/configmap.yaml -f k8s/app/service.yaml -f k8s/app/hpa.yaml
          kubectl set image --local -f k8s/app/deployment.yaml app="$IMAGE" -o yaml | kubectl apply -f -
          kubectl set env deployment/garageflow-app -n garageflow "APP_PUBLIC_BASE_URL=http://$ALB_DNS/api"
          kubectl rollout status deployment/garageflow-app -n garageflow --timeout=300s

      - name: Smoke test pelo ALB
        env:
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "ALB: $ALB_DNS"

          echo "GET /api/actuator/health/readiness (mesmo caminho do health check do ALB)"
          curl -sf --retry 30 --retry-delay 10 --retry-all-errors --retry-connrefused \
            -o /dev/null -w "HTTP %{http_code}\n" "http://$ALB_DNS/api/actuator/health/readiness"

          echo "POST /api/auth/login (prova Secrets + Mongo funcionando)"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://$ALB_DNS/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@garageflow.com\",\"password\":\"${ADMIN_SEED_PASSWORD}\"}")
          echo "HTTP $code"
          test "$code" = "200"

      - name: Mostrar HPA e pods
        if: always()
        run: kubectl get pods,svc,hpa -n garageflow

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get nodes
          kubectl describe pods -n garageflow
          kubectl logs -n garageflow -l app.kubernetes.io/name=garageflow-app --tail=100 || true
