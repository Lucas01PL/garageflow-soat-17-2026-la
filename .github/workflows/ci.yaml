name: CI

on:
  push:
    branches: [develop-ci-and-cd]
  pull_request:
    branches: [develop-ci-and-cd]
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    # Só necessário se seus testes de integração usam um Mongo real.
    # Se usar Testcontainers, apague este bloco (o runner já tem Docker).
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/garageflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: garageflow-jar
          path: target/*.jar
          retention-days: 1
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test          # só roda se build-test passar
    permissions:
      contents: read
      packages: write          # necessário para publicar no GHCR

    steps:
      - uses: actions/checkout@v4

      # O GHCR exige o nome da imagem em minúsculas
      - name: Nome da imagem
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Login só fora de PR (só publicamos na main)
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: docker              # só roda se a imagem foi publicada
    if: github.event_name != 'pull_request'   # em PR a imagem nem é enviada
    permissions:
      contents: read

    # Nomes definidos pelo Terraform (infra/environments/dev):
    # cluster = "<project_name>-<environment>", ALB = "<project_name>-<environment>-alb"
    env:
      AWS_REGION: us-east-1
      CLUSTER_NAME: garageflow-dev
      ALB_NAME: garageflow-dev-alb

    steps:
      - uses: actions/checkout@v4

      # Imagem publicada pelo job anterior (tag = SHA do commit)
      - name: Nome da imagem
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Credenciais da AWS vêm do GitHub Secrets (usuário IAM do admin_role_arn)
      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Gera o kubeconfig do cluster criado pelo Terraform
      - name: Conectar no cluster EKS
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
          kubectl cluster-info

      # O nó pode levar alguns minutos para entrar no cluster depois do apply
      - name: Esperar o nó ficar pronto
        run: kubectl wait --for=condition=Ready node --all --timeout=600s

      # Necessário para o HPA. O EKS não traz o metrics-server por padrão
      - name: Instalar metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s

      - name: Namespace
        run: kubectl apply -f k8s/namespace.yaml

      # Secrets reais vêm do GitHub Secrets. Os secret.yaml do repo são só
      # placeholders e NÃO são aplicados aqui (sobrescreveriam os reais).
      - name: Criar Secrets
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          kubectl create secret generic mongo-secret -n garageflow \
            --from-literal=MONGO_INITDB_ROOT_USERNAME=admin \
            --from-literal=MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic garageflow-app-secret -n garageflow \
            --from-literal=SPRING_MONGODB_URI="mongodb://admin:${MONGO_PASSWORD}@mongo:27017/garageflow-soat-17-2026-db?authSource=admin" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_SEED_PASSWORD="$ADMIN_SEED_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Banco primeiro: a app já conecta no Mongo ao iniciar
      - name: Deploy do MongoDB
        run: |
          kubectl apply -f k8s/mongo/service.yaml -f k8s/mongo/statefulset.yaml
          kubectl rollout status statefulset/mongo -n garageflow --timeout=300s

      # `set image --local` troca a imagem no YAML em memória (sem tocar no
      # arquivo do repo nem no cluster) e o apply já sobe com a tag do SHA
      - name: Deploy da aplicação
        run: |
          kubectl apply -f k8s/app/configmap.yaml -f k8s/app/service.yaml -f k8s/app/hpa.yaml
          kubectl set image --local -f k8s/app/deployment.yaml app="$IMAGE" -o yaml | kubectl apply -f -
          kubectl rollout status deployment/garageflow-app -n garageflow --timeout=300s

      # Testa a API de fora do cluster, pelo Load Balancer. O ALB só marca o nó
      # como saudável depois que a app responde, então o curl tenta por até ~5 min
      - name: Smoke test pelo ALB
        env:
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          echo "ALB: $ALB_DNS"

          echo "GET /api/openapi (rota pública)"
          curl -sf --retry 30 --retry-delay 10 --retry-all-errors --retry-connrefused \
            -o /dev/null -w "HTTP %{http_code}\n" "http://$ALB_DNS/api/openapi"

          echo "POST /api/auth/login (prova Secrets + Mongo funcionando)"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://$ALB_DNS/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@garageflow.com\",\"password\":\"${ADMIN_SEED_PASSWORD}\"}")
          echo "HTTP $code"
          test "$code" = "200"

      - name: Mostrar HPA e pods
        if: always()
        run: kubectl get pods,svc,hpa -n garageflow

      # Se algo falhar, mostra o motivo no log do GitHub
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          kubectl get nodes
          kubectl describe pods -n garageflow
          kubectl logs -n garageflow -l app.kubernetes.io/name=garageflow-app --tail=100 || true
          kubectl logs -n garageflow mongo-0 --tail=50 || true
