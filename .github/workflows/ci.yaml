name: CI

on:
  push:
    branches: [develop-ci-and-cd]
  pull_request:
    branches: [develop-ci-and-cd]
  workflow_dispatch:

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    # Só necessário se seus testes de integração usam um Mongo real.
    # Se usar Testcontainers, apague este bloco (o runner já tem Docker).
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    env:
      SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/garageflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build e testes
        run: mvn -B verify

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: garageflow-jar
          path: target/*.jar
          retention-days: 1
  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build-test          # só roda se build-test passar
    permissions:
      contents: read
      packages: write          # necessário para publicar no GHCR

    steps:
      - uses: actions/checkout@v4

      # O GHCR exige o nome da imagem em minúsculas
      - name: Nome da imagem
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Login só fora de PR (só publicamos na main)
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max