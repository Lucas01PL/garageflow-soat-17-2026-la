spring:
  application:
    name: garageflow-soat-17-2026-la

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://admin:admin123@localhost:27017/garageflow-soat-17-2026-db?authSource=admin}

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs

  api-docs:
    path: /openapi

logging:
  level:
    br.com.fiap.tech.challeng.garageflow_soat_17_2026_la: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 60

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@garageflow.com}
    password: ${ADMIN_SEED_PASSWORD}